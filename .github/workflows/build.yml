name: BTS Army World V2 CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check project ZIP
        run: |
          set -euo pipefail
          test -f BTS_Army_World_V2_Design_Update.zip
          mkdir -p app
          unzip -q BTS_Army_World_V2_Design_Update.zip -d app

          if [ ! -f app/pubspec.yaml ]; then
            PROJECT_DIR="$(find app -name pubspec.yaml -print -quit | xargs -r dirname)"
            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: pubspec.yaml not found in ZIP"
              exit 1
            fi
            cp -a "$PROJECT_DIR/." app/
          fi

          test -f app/pubspec.yaml
          echo "Flutter project found."

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Patch wallpaper plugin namespace
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          cache = Path.home() / ".pub-cache/hosted/pub.dev"
          files = list(cache.glob("flutter_wallpaper_manager-*/android/build.gradle"))

          if not files:
              raise SystemExit("ERROR: flutter_wallpaper_manager Gradle file not found")

          gradle = files[0]
          manifest = gradle.parent / "src/main/AndroidManifest.xml"
          package_name = "com.example.flutter_wallpaper_manager"

          if manifest.exists():
              try:
                  package_name = ET.parse(manifest).getroot().attrib.get(
                      "package", package_name
                  )
              except ET.ParseError:
                  print("Warning: plugin manifest could not be parsed.")

          content = gradle.read_text()

          if not re.search(r"^\s*namespace\s+", content, re.MULTILINE):
              updated, count = re.subn(
                  r"(\bandroid\s*\{)",
                  lambda match: match.group(1) + "\n    namespace '" + package_name + "'",
                  content,
                  count=1,
              )

              if count == 0:
                  raise SystemExit("ERROR: Could not find android block in plugin Gradle file")

              gradle.write_text(updated)

          print("Namespace patch checked:", package_name)
          PY

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Build Android App Bundle
        working-directory: app
        run: flutter build appbundle --release

      - name: Upload APK and AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BTS-Army-World-V2-Android
          path: |
            app/build/app/outputs/flutter-apk/*.apk
            app/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7
