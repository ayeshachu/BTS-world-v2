name: Test BTS Army World V2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract uploaded project ZIP
        run: |
          test -f BTS_Army_World_V2_Design_Update.zip
          mkdir app
          unzip -q BTS_Army_World_V2_Design_Update.zip -d app
          test -f app/pubspec.yaml

      - name: Get Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Build test APK
        working-directory: app
        run: flutter build apk --release

      - name: Build Android App Bundle
        working-directory: app
        run: flutter build appbundle --release

      - name: Save build files for download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BTS-Army-World-V2-builds
          path: |
            app/build/app/outputs/flutter-apk/*.apk
            app/build/app/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 7
          
